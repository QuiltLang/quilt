[package]
edition.workspace = true
name = "quilt_python"
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Python bindings to Quilt's core IR — the runtime that expanded .py.quilt files target (import name: quilt)."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]
name = "quilt_python"

[dependencies]
pyo3 = {workspace = true, features = ["abi3-py38"]}
postcard = {workspace = true, features = ["alloc"]}
# `python` gives us `langs::python::ops`, which builds the Python source that
# reconstructs a term — what `qlift` on an already-built QTerm must return
# under the `↓(↑(x)) == x` law (issue #166). The feature pulls no parser.
quilt = {workspace = true, features = ["python"]}
