[package]
edition.workspace = true
# Published as `quiltlang` (`quilt` is taken on crates.io); the lib target
# below keeps the `quilt` import name, so `use quilt::prelude::*` works
# everywhere. External consumers depend on it via
# `quilt = { package = "quiltlang", version = "0.1" }`. See issue #33.
name = "quiltlang"
description = "Quilt, a polyglot metaprogramming language: source code with arrow-bracket syntax for embedding and manipulating code fragments of other languages at code-generation time."
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Compiles the vendored tree-sitter parsers under `grammars/<lang>/` (see
# `build.rs` and `src/grammars.rs`), gated on the language features below.
build = "build.rs"

[lib]
name = "quilt"

[dependencies]
clap = {workspace = true, features = ["derive"]}
indoc = {workspace = true}
miette = {workspace = true, features = ["fancy"]}
postcard = {workspace = true, features = ["alloc", "use-std"]}
regex = {workspace = true}
serde = {workspace = true, features = ["derive", "rc"]}
# The live notebook's wire format (the `serve` feature). Nothing else in the
# crate speaks JSON: the expand cache is postcard, and the machines' wire is
# each interpreter's own printing.
serde_json = {workspace = true, optional = true}
tempfile = {workspace = true}
tracing = {workspace = true}
tracing-subscriber = {workspace = true, features = ["env-filter"]}
# Tree-sitter parsing is only needed to *parse* Quilt sources (the `parse`
# feature). The runtime that expanded code targets (the `QTerm` builders,
# `qlift`, `coparse`) is tree-sitter-free, so consumers like nanobots-codegen
# can depend on quilt with `default-features = false, features = ["rust"]` and
# build for `wasm32-unknown-unknown` without the tree-sitter C runtime.
tree-sitter = {workspace = true, optional = true}
# The downstream grammars (rust, python, typescript, wgsl, bash, html, zsh, nix)
# are vendored under `grammars/<lang>/` and compiled by `build.rs`, not pulled as
# crates — that keeps `quiltlang` free of the git dependencies crates.io rejects
# (issue #32). `tree-sitter-language` provides the `LanguageFn` type the
# generated-parser bindings in `src/grammars.rs` wrap.
tree-sitter-language = {version = "0.1", optional = true}

[build-dependencies]
cc = "1.2"

[dev-dependencies]
indoc = {workspace = true}
# Expander output is snapshotted rather than pinned with inline string
# literals, so a deliberate cross-cutting change is a bulk review
# (`cargo insta review`) instead of N hand edits. See issue #157.
# `glob` drives the `tests/ui/` diagnostic corpus (issue #160): one snapshot per
# case file, with every mismatch reported instead of stopping at the first.
insta = {workspace = true, features = ["glob"]}
pretty_assertions = {workspace = true}

[lints]
workspace = true

[features]
bootstrap = ["parse"]
default = ["python", "rust", "text", "bootstrap", "wgsl", "html", "zsh", "bash", "typescript", "nix", "lean", "sql", "serve"]
# `quilt notebook --serve`: a notebook session behind a socket (`src/serve`).
# The server is hand-written on `std::net` — the one dependency it adds is
# JSON for the wire — but it is still a *server* in a library crate, so an
# embedder can turn it off. Implies what a notebook needs.
serve = ["html", "parse", "dep:serde_json"]
# `parse` enables tree-sitter: the `Language` providers, `omni`, and `Multi`'s
# parse path. Not the *Quilt* parser — `node` is hand-written and needs no
# grammar (issue #254), so it is in the runtime-only build too. Off by default for
# the runtime-only consumers (e.g. nanobots-codegen on wasm). It also pulls in
# the vendored rust + python parsers (the host languages); `build.rs` compiles
# their C when this feature is set. The target-language features below each add
# their own vendored parser and imply `parse`.
parse = [
  "dep:tree-sitter",
  "dep:tree-sitter-language",
]
bash = ["parse"]
html = ["parse"]
# Lean's vendored `parser.c` is ~44MB — by far the largest grammar we carry —
# so this feature is the one worth turning off first if package size or C
# compile time becomes a problem. See issue #134.
lean = ["parse"]
nix = ["parse"]
python = []
rust = []
# SQL's vendored `parser.c` is ~42MB, second only to Lean's — the grammar is
# permissive across several dialects and carries several hundred keyword rules.
# The same caveat as `lean` applies: turn this off first if package size or C
# compile time becomes a problem.
sql = ["parse"]
text = []
# Like `python` and `rust`, and unlike the other targets: the TypeScript
# *runtime* (`langs::typescript::{meta, ops}`) is pure QTerm manipulation and
# needs no parser, so this must not imply `parse`. `quilt-wasm` is exactly that
# consumer — it generates TypeScript on wasm32 with no C runtime. The vendored
# parser is still gated: `langs::typescript::lang` and `grammars` are both
# `#[cfg(feature = "parse")]`, and build.rs returns early without it.
typescript = []
wgsl = ["parse"]
zsh = ["parse"]

# Throughput of the Quilt surface parser (issue #254). `harness = false`
# because it is a `fn main`, not `#[bench]` (nightly-only) and not criterion (a
# dev-dependency tree out of all proportion to one number).
[[bench]]
harness = false
name = "parse"

[[bin]]
name = "quilt"
path = "src/bin.rs"
# The CLI parses Quilt sources, so it needs tree-sitter.
required-features = ["parse"]
