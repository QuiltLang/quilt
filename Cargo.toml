[workspace]
resolver = "2"
# quilt-python, quilt-wasm, and quilt-expand-wasm are intentionally NOT in
# default-members. quilt-python is a PyO3 `cdylib` that links libpython, so
# including it would make a bare `cargo build` / `cargo test` at the workspace
# root require a Python interpreter + dev headers. quilt-wasm is a wasm-bindgen
# `cdylib` whose real artifact is `wasm-pack build`ed for
# `wasm32-unknown-unknown`. quilt-expand-wasm is a WASI command whose real
# artifact is built for `wasm32-wasip1` against a WASI sysroot (see its
# Cargo.toml). The common CLI/LSP path needs none of them. Build them
# explicitly: `cargo build -p quilt_python` (or `bin/build-py`), `wasm-pack
# build quilt-wasm`, and `bin/build-expand-wasm`.
default-members = [
  "quilt",
  "quilt-conformance",
  "quilt-lsp",
]
# The cargo-fuzz targets are their own workspace (fuzz/Cargo.toml declares an
# empty `[workspace]`): libFuzzer needs a nightly toolchain and `-Zsanitizer`,
# and nothing else here does. Excluding it keeps `cargo build` / `cargo test`
# at the root from ever reaching for them. Run them with `bin/fuzz`.
exclude = ["fuzz"]
members = [
  "quilt",
  "quilt-conformance",
  "quilt-lsp",
  "quilt-python",
  "quilt-wasm",
  "quilt-expand-wasm",
]

[workspace.package]
edition = "2021"
version = "0.5.0"
license = "MIT OR Apache-2.0"
authors = ["Alexander Varga <varga.alex@gmail.com>"]
repository = "https://github.com/QuiltLang/quilt"

[workspace.dependencies]
# Internal crates. The core package is published as `quiltlang` (issue #33);
# `package =` keeps the `quilt` dependency key so `use quilt::...` is unchanged.
quilt = {version = "0.5.0", path = "quilt", package = "quiltlang", default-features = false}
# `version` is required alongside `path` so dependents (quiltlang, quilt-lsp)
# can be `cargo publish`ed: the registry copy drops `path` and keeps `version`.
# Grammar crates pulled from their QuiltLang forks (previously git submodules).
# Each is pinned to an explicit `rev` so the build is reproducible even for
# library consumers and `cargo install --git … quiltlang` runs that ignore our
# Cargo.lock: without a pin these track the fork's default-branch HEAD, so a new
# commit or force-push on a fork would silently change builds. Bump a rev here
# deliberately when pulling in upstream grammar changes.
tree-sitter-bash = {git = "https://github.com/QuiltLang/tree-sitter-bash.git", rev = "4e44c9fca4f64f75dbafd64d07eb3b065f15e45b"}
tree-sitter-html = {git = "https://github.com/QuiltLang/tree-sitter-html.git", rev = "d81ae0f44b1e084a3383b3355c62cb6953260467"}
# Lean needs no Quilt hole patch: `__QUILT_HOLE__` already matches Lean's
# identifier regex, so it parses in term/tactic/name position unmodified (the
# same trick as tree-sitter-nix). This rev is the fork's unpatched tip; see
# issue #133 for the one position that costs — a bare hole as a whole command.
tree-sitter-lean = {git = "https://github.com/QuiltLang/tree-sitter-lean.git", rev = "86c2bcb379fe0b2ad13d8b3411400deff75b2785"}
tree-sitter-nix = {git = "https://github.com/QuiltLang/tree-sitter-nix.git", rev = "3d0173d903e630b6e14d17f1cf79488791379ded"}
tree-sitter-python = {git = "https://github.com/QuiltLang/tree-sitter-python.git", rev = "90d5b14ac598ba8d56708c0aef40b9b1ba48722e"}
# `quilt_hole` is `token(prec(-1, "{}"))`, not a plain "{}" token: the lexer
# prefers the longest match among the tokens valid in a state, so at plain
# precedence it outbid the `{` starting a `block` wherever a pattern could still
# continue — which made `|x| {}`, a closure with an empty block body, parse as an
# or-pattern (issue #241, QuiltLang/tree-sitter-rust#1).
# This rev merges upstream through `77a3747` ("0.24.2") and regenerates with CLI
# 0.26.13 (QuiltLang/tree-sitter-rust#2, issue #184).
tree-sitter-rust = {git = "https://github.com/QuiltLang/tree-sitter-rust.git", rev = "db55a6f39342a60fe284f07d782e1160ce774c0f"}
# SQL needs no Quilt hole patch either: `__QUILT_HOLE__` matches this grammar's
# `_identifier` regex, so it parses unpatched in predicate, select-expression,
# relation-name and `IN`-list position (the same free ride nix and lean get).
# The fork's one deviation from upstream is that it *commits* the generated
# parser: upstream publishes it on a separate `gh-pages` branch, and nothing
# ties a `gh-pages` commit to the `grammar.js` it was generated from, so that
# branch cannot be pinned (QuiltLang/tree-sitter-sql#1, issue #219).
tree-sitter-sql = {git = "https://github.com/QuiltLang/tree-sitter-sql.git", rev = "6e9e52267c5eca3d3c80a8979a6f54e25bdef419"}
# The `quilt_hole` change (issue #44) is merged to the fork's master; this rev
# is its tip, adding the `__HOLE__` interpolation token.
tree-sitter-typescript = {git = "https://github.com/QuiltLang/tree-sitter-typescript.git", rev = "25f4db1700b970293b83c5964581ff8ef718106f"}
tree-sitter-wgsl = {git = "https://github.com/QuiltLang/tree-sitter-wgsl.git", rev = "a83b84c4dd9ce8f28ee79d36b09ccbaef0f51d6b"}
# `((` inside a double-quoted string is content, not the arithmetic-command
# opener (issue #212, QuiltLang/tree-sitter-zsh#1). The same commit parks the
# fork's `quilt_hole` rule: it panics `tree-sitter generate` at
# `render.rs:1253` on every CLI ≥0.26.9 and hangs on older ones, and it had
# never reached a generated parser, so it was blocking regeneration outright.
# Holes still parse as `word`, which is all `zsh/lang.rs` asks for.
tree-sitter-zsh = {git = "https://github.com/QuiltLang/tree-sitter-zsh.git", rev = "c768088ca877105376e957aa7739a1b5d203806a"}

# External crates (versions only; features are selected per-crate)
anyhow = "1"
clap = "4.6"
dashmap = "6"
indoc = "2.0"
insta = "1"
miette = "7.4"
postcard = "1.1"
pretty_assertions = "1.4"
proptest = "1"
pyo3 = "0.29"
regex = "1.12"
serde = "1.0"
serde_json = "1.0"
streaming-iterator = "0.1"
tempfile = "3.27"
tokio = "1"
toml = "1.1"
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = "0.3"
tree-sitter = "0.26"

[workspace.lints.clippy]
pedantic = "warn"

default_trait_access = {level = "allow", priority = 1}
items_after_statements = {level = "allow", priority = 1}
missing_errors_doc = {level = "allow", priority = 1}
missing_panics_doc = {level = "allow", priority = 1}
module_name_repetitions = {level = "allow", priority = 1}
must_use_candidate = {level = "allow", priority = 1}
needless-raw-string-hashes = {level = "allow", priority = 1}
redundant_closure_for_method_calls = {level = "allow", priority = 1}
return_self_not_must_use = {level = "allow", priority = 1}
similar_names = {level = "allow", priority = 1}
too_many_lines = {level = "allow", priority = 1}
