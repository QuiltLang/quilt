name: Nightly

# Checks worth running but too slow for the PR path, which is deliberately kept
# under a few minutes. Everything here is also runnable by hand
# (`workflow_dispatch`) when a change touches the relevant area, so nobody has
# to wait a day to find out.
on:
  schedule:
    # 04:00 UTC — after any evening merges have settled.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "5"

jobs:
  # Runtime parity (issue #159): drive all three published runtimes —
  # quiltlang, quilt-python, quilt-wasm — through the same corpus. Nightly
  # rather than per-PR because it builds a PyO3 cdylib and a wasm artifact.
  #
  # The Rust third of the corpus still runs in the normal `cargo test`, so a
  # corpus that no longer parses, or a Rust-side regression, fails on the PR
  # path within seconds. What waits for nightly is specifically cross-runtime
  # *divergence*, which needs the other two built.
  runtimes:
    name: Runtime parity (rust + python + wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop ./nix --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
            target
          key: nightly-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            nightly-${{ runner.os }}-cargo-
      # wasm-pack now comes from the flake devShell. It used to be installed
      # here with the official curl|sh installer, which cannot work inside that
      # shell: it copies the binary next to the `cargo` on PATH — the read-only
      # /nix/store rustup — and ignores $CARGO_HOME, so it failed with EACCES.
      # The failure was invisible, because bin/test-runtimes *skips* the wasm
      # runtime when wasm-pack is missing: this job reported runtime parity
      # while only ever comparing two of the three runtimes.
      - run: bin/test-runtimes

  # Tier 6 properties (issue #161) at nightly strength. The same properties run
  # on every PR inside `bin/ctest` — `quilt-conformance` is a default-member —
  # but at a few hundred cases each, so the PR path stays under a second. This
  # runs them two orders of magnitude harder, which is where an escaping bug in
  # a rare character combination actually turns up: the zsh `((` finding (#212)
  # took ~600 cases in one language.
  #
  # Cheap enough that it needs no artifact and no separate build — it is the
  # same test binary `cargo test` already produces.
  properties:
    name: Properties (proptest, high case count)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop ./nix --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
            target
          key: nightly-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            nightly-${{ runner.os }}-cargo-
      - run: PROPTEST_CASES=20000 cargo test -p quilt-conformance --test properties
      # A shrunk counterexample is the whole value of a property failure, and
      # proptest also writes it to a regression file so the exact case can be
      # replayed. Upload it rather than making someone re-derive it from the log.
      - name: Upload proptest regressions
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions
          path: "**/proptest-regressions/**"
          if-no-files-found: ignore

  # Fuzzing (issue #161). Nightly and time-boxed rather than on the PR path:
  # it is unbounded by nature, and it needs a *nightly* Rust toolchain, because
  # libFuzzer builds with `-Zsanitizer` and the repo is pinned to stable
  # (rust-toolchain.toml). Everything else in CI runs on that pin.
  #
  # The corpus is cached, so each run continues from the coverage the previous
  # ones reached instead of restarting from the seeds every night — that
  # accumulation is most of what makes short daily budgets worth anything.
  fuzz:
    name: Fuzz (quilt surface + expander)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop ./nix --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
            fuzz/target
          key: fuzz-${{ runner.os }}-cargo-${{ hashFiles('fuzz/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            fuzz-${{ runner.os }}-cargo-
      # The evolving corpus, keyed so every run restores the newest one and
      # saves a fresh copy: actions/cache keys are immutable, so a rolling
      # `run_id` suffix plus a prefix restore-key is the documented way to keep
      # appending to a cache rather than freezing the first version of it.
      - uses: actions/cache@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked
      # 10 minutes of actual fuzzing (three targets at 200s each). Measured
      # ~14 min wall clock on a cold cache — the sanitizer build of the three
      # targets dominates the rest — and less once fuzz/target is restored.
      - run: bin/fuzz 200
      # A crash is the entire point of the job, so make it downloadable and
      # replayable (`cargo +nightly fuzz run <target> <artifact>`) rather than
      # something to reconstruct from a log.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/**
          if-no-files-found: ignore

  # Coverage (phase 5 of #144). Reporting, not a gate: the epic asks for the
  # number first and a ratchet on `quilt/src/langs/**` later, and failing a PR
  # on a figure nobody has read yet would invert that order. The tables go into
  # the job summary so reading them costs no download; lcov stays an artifact
  # for anything that wants to render it.
  #
  # Nightly rather than per-PR because instrumenting is a full rebuild of the
  # workspace. The tests themselves add about a minute.
  coverage:
    name: Coverage (workspace + langs ratchet)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop ./nix --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
            target
          key: coverage-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            coverage-${{ runner.os }}-cargo-
      - run: bin/coverage --ci coverage-report
      # The whole-workspace table is long; the langs one is the part with a
      # decision attached to it, so it goes first and open.
      - name: Job summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo
            echo '### `quilt/src/langs/**` — the ratchet subtree'
            echo
            echo '```'
            cat coverage-report/langs.txt
            echo '```'
            echo
            echo '<details><summary>Whole workspace, per file</summary>'
            echo
            echo '```'
            cat coverage-report/summary.txt
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report/**
          if-no-files-found: ignore
