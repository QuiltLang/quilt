name = "nix"
display = "Nix"
aliases = []
feature = "nix"
meta_kind = "string"
comment_prefix = "#"
lang_src = "quilt/src/langs/nix/lang.rs"
meta_src = "quilt/src/langs/nix/meta.rs"
blurb = """
A quotable target and a string-based host. Generate derivations, flakes and \
modules at build time; as a host, a `.nix.quilt` metaprogram expands to plain \
Nix that builds the output with `${…}` antiquotation."""

# Derived from the grammar's `REPEAT` rules (#202). `source_code` was in the
# hand-written table and is not derived: its only field is a single optional
# expression, so a Nix file is one expression rather than a sequence the way a
# Rust `source_file` is.
variadic = ["list_expression", "binding_set", "formals"]
not_variadic = ["integer_expression", "select_expression", "source_code"]

lift_marker = "Nix"
lift_from = ["nix"]
lift_from_unsupported = ["rust", "rs", "python", "py", "wgsl", "lean", "lean4", "html", "typescript", "ts", "text", "txt"]

[capabilities]
quotable = {status = "supported"}
hole-positions = {status = "supported", note = "Nix is purely expression-oriented, so every position is an expression and `__QUILT_HOLE__` parses unpatched as a `variable_expression`"}
variadic-containers = {status = "supported"}
kind-classification = {status = "supported"}
lift-into = {status = "supported"}
highlights = {status = "supported"}
host = {status = "supported"}
lift-from = {status = "supported"}
reduce = {status = "planned", note = "no reduce backend: the string-based meta has no `QTerm` runtime to evaluate against", issue = 155}
emit = {status = "partial", note = "the string model has no `b_` accumulator, so `←` is the *functional* reading of emit: it takes the whole list of fragments and joins it into the surrounding container (`builtins.concatStringsSep \"\\n\"`, applied prefix like `↑`). Building that list is `map`, not a ground loop, and joined fragments are not re-indented", issue = 155}
pattern-match = {status = "unsupported", note = "no `pattern_tag`/`pattern_var` implementation; Nix fragments can still be destructured by a Rust host"}
runnable = {status = "unsupported", note = "a `.nix` file is evaluated with `nix eval`, not executed, so there is no shebang runner"}
runtime-binding = {status = "planned", note = "string-based meta: no `QTerm` runtime library is shipped for Nix", issue = 155}
glyph-collisions = {status = "supported"}
chain-member = {status = "supported"}
header-comment = {status = "supported", note = "generated Nix files use `#`, not `//!`"}
lsp = {status = "partial", note = "embedded-quote highlighting only, from the vendored `highlights.scm`; no downstream Nix server is proxied", issue = 154}

[[fragments]]
name = "integer"
code = "1"
tag = "integer_expression"

[[fragments]]
name = "attrset"
code = "{ a = 1; }"
tag = "attrset_expression"

[[fragments]]
name = "list"
code = "[ 1 2 ]"
tag = "list_expression"

[[fragments]]
name = "select"
code = "pkgs.hello"
tag = "select_expression"

[[holes]]
name = "attr_value"
code = "{ a = @; }"
ikinds = ["expr"]

[[lift]]
value = "u32:3"
tag = "integer_expression"
text = "3"

[[lift]]
value = "f32:1.5"
tag = "float_expression"
text = "1.5"

[[lift]]
value = "f32:-1.5"
tag = "float_expression"
text = "-1.5"

[[lift]]
value = "bool:true"
tag = "variable_expression"
text = "true"

[[lift]]
value = "bool:false"
tag = "variable_expression"
text = "false"

[[lift]]
value = "str:plain"
tag = "string_expression"
text = '"hi"'

[[lift]]
value = "str:tricky"
tag = "string_expression"
text = '"a\"b\\c\${d}"'

[kinds]
integer_expression = "expr"
attrset_expression = "expr"
list_expression = "expr"
select_expression = "expr"

# String-based meta: no `QTerm` runtime, so `←` is a plain `builtins` join
# rather than a push into an accumulator, and `⟨T⟩` has no spelling at all and
# must fail loudly rather than leak a placeholder into generated Nix.
[meta]
emit = '(builtins.concatStringsSep "\n")'
type_error = "untyped"
name_str = "toString"
reduce_unsupported = ["", "nix", "rust", "rs", "python", "py", "wgsl", "html", "lean", "lean4", "bash", "zsh", "typescript", "ts"]

# How this host embeds a quote of another language, for the cross-language grid
# (#158). `@` is replaced by `<target>↖…↗`; `lift` is how a lifted ground value
# is spelled in *this* host's syntax — Rust's `↑` is postfix, Python's prefix.
[cross]
wrapper = "@"
lift = "↑ v"
