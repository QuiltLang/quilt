name = "text"
display = "Plain text"
aliases = ["txt"]
feature = "text"
meta_kind = "none"
lang_src = "quilt/src/langs/text/lang.rs"
blurb = """
Quote an arbitrary fragment with no language-specific parsing — useful for \
generating configuration, prose or any format Quilt has no grammar for. A text \
term is one `text` tuple whose commands interleave literal runs with holes."""

# Text has no node kinds, so its single tag accepts as many spliced children as
# the author writes holes for.
variadic = ["text"]
not_variadic = []

lift_marker = "Text"

[capabilities]
quotable = {status = "supported"}
hole-positions = {status = "supported", note = "text imposes no kind on a hole, so a spliced child is rendered however the host built it"}
variadic-containers = {status = "supported"}
kind-classification = {status = "supported", note = "a text fragment is always an opaque value, so `typ()` answers `Expr` for every tag"}
lift-into = {status = "supported", note = "text has no grammar, so the spelling is a *dialect*'s: the default, `Json`, writes JSON literals (strings quoted and escaped, `[a, b]` lists), which are also valid YAML, TOML, JS and HCL values. A hole between two `\"` the author wrote lifts a string as its escaped contents (`InQuotes`). A host picks another dialect — the built-in `Raw`, or one it writes by overriding only the rules that differ — per site or per module; see `docs/wiki/concepts.md`"}
highlights = {status = "unsupported", note = "plain text has no grammar to highlight"}
host = {status = "unsupported", note = "the `TextMetaLanguage` exists but is identity-only and is not registered as a host in `Omni`"}
lift-from = {status = "unsupported", note = "not a host: nothing to lift from"}
reduce = {status = "unsupported", note = "not a host: no meta-language to reduce with"}
machine = {status = "unsupported", note = "text holds code rather than running it, so there is no machine to feed"}
emit = {status = "unsupported", note = "target-only: `←` is the *host's* operator, so this language has no emit of its own. What matters for a target is having variadic containers to receive emitted children, which is the Variadic axis"}
pattern-match = {status = "unsupported", note = "target-only; text fragments can still be destructured by a Rust host"}
runnable = {status = "unsupported", note = "plain text is not executable"}
runtime-binding = {status = "unsupported", note = "target-only: no runtime library"}
glyph-collisions = {status = "supported"}
chain-member = {status = "supported"}
header-comment = {status = "unsupported", note = "target-only: never the ground language, so no generated-file header is produced"}
lsp = {status = "unsupported", note = "nothing to project: plain text has no downstream server"}

[[fragments]]
name = "plain"
code = "hello, world"
tag = "text"

[[fragments]]
name = "multiline"
code = "line one\nline two\n\nline four"
tag = "text"

[[fragments]]
name = "glyph_like_content"
code = "arrows and braces: {} ${} <- stay literal"
tag = "text"

[[holes]]
name = "mid_string"
code = "a=@ b=@"
ikinds = ["any", "any"]

# JSON's spelling, the default dialect's.
[[lift]]
value = "u32:3"
tag = "text"
text = "3"

[[lift]]
value = "i32:-7"
tag = "text"
text = "-7"

[[lift]]
value = "f32:1.5"
tag = "text"
text = "1.5"

[[lift]]
value = "bool:true"
tag = "text"
text = "true"

[[lift]]
value = "str:plain"
tag = "text"
text = '"hi"'

[[lift]]
value = "str:tricky"
tag = "text"
text = '"a\"b\\c${d}"'

# A newline is escaped, so a lifted value cannot start a new line of config.
[[lift]]
value = "str:newline"
tag = "text"
text = '"a\nb: c"'

[[lift]]
value = "vec:strs"
tag = "text"
text = '["a", "b c"]'

# Between two `"` the author wrote: the contents, escaped, no quotes of its own.
[[lift]]
value = "in_quotes:tricky"
tag = "text"
text = 'a\"b\\c${d}'

# The `Raw` dialect: verbatim.
[[lift]]
value = "raw:tricky"
tag = "text"
text = 'a"b\c${d}'

[kinds]
text = "expr"
