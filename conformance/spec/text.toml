name = "text"
display = "Plain text"
aliases = ["txt"]
feature = "text"
meta_kind = "none"
lang_src = "quilt/src/langs/text/lang.rs"
blurb = """
Quote an arbitrary fragment with no language-specific parsing — useful for \
generating configuration, prose or any format Quilt has no grammar for. A text \
term is one `text` tuple whose commands interleave literal runs with holes."""

# Text has no node kinds, so its single tag accepts as many spliced children as
# the author writes holes for.
variadic = ["text"]
not_variadic = []

[capabilities]
quotable = {status = "supported"}
hole-positions = {status = "supported", note = "text imposes no kind on a hole, so a spliced child is rendered however the host built it"}
variadic-containers = {status = "supported"}
kind-classification = {status = "supported", note = "a text fragment is always an opaque value, so `typ()` answers `Expr` for every tag"}
lift-into = {status = "unsupported", note = "no `LiftTo<Text>` marker; a host that wants a value as text lifts it in its own language and splices the result", issue = 144}
highlights = {status = "unsupported", note = "plain text has no grammar to highlight"}
host = {status = "unsupported", note = "the `TextMetaLanguage` exists but is identity-only and is not registered as a host in `Omni`"}
lift-from = {status = "unsupported", note = "not a host: nothing to lift from"}
reduce = {status = "unsupported", note = "not a host: no meta-language to reduce with"}
emit = {status = "supported", note = "the single `text` tag is variadic, so a host can emit into it"}
pattern-match = {status = "unsupported", note = "target-only; text fragments can still be destructured by a Rust host"}
runnable = {status = "unsupported", note = "plain text is not executable"}
runtime-binding = {status = "unsupported", note = "target-only: no runtime library"}
glyph-collisions = {status = "supported"}
chain-member = {status = "supported"}
header-comment = {status = "unsupported", note = "target-only: never the ground language, so no generated-file header is produced"}
lsp = {status = "unsupported", note = "nothing to project: plain text has no downstream server"}

[[fragments]]
name = "plain"
code = "hello, world"
tag = "text"

[[fragments]]
name = "multiline"
code = "line one\nline two\n\nline four"
tag = "text"

[[fragments]]
name = "glyph_like_content"
code = "arrows and braces: {} ${} <- stay literal"
tag = "text"

[[holes]]
name = "mid_string"
code = "a=@ b=@"
ikinds = ["any", "any"]

[kinds]
text = "expr"
