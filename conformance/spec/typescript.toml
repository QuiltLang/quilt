name = "typescript"
display = "TypeScript"
aliases = ["ts"]
feature = "typescript"
meta_kind = "runtime"
comment_prefix = "//"
lang_src = "quilt/src/langs/typescript/lang.rs"
meta_src = "quilt/src/langs/typescript/meta.rs"
blurb = """
The host behind the browser playground. Expanded `.ts.quilt` code calls the \
`quilt-wasm` runtime, so a metaprogram can run in the browser with no server — \
or under node, where `quilt run` binds the same runtime and adds `↓`."""

# Derived from the grammar's `REPEAT` rules (#202). `lexical_declaration` was
# pinned as *not* variadic while the table was hand-written; it is
# `commaSep1($.variable_declarator)`, so `const a = 1, b = 2` genuinely has a
# variable number of direct children.
#
# `arguments`, `array` and `formal_parameters` are containers the derivation
# added: emit (`←`) can now splice a sequence into an argument list.
variadic = [
  "program",
  "statement_block",
  "lexical_declaration",
  "arguments",
  "array",
  "formal_parameters",
]
not_variadic = ["binary_expression", "identifier"]

lift_from = ["typescript", "ts", "html"]
lift_from_unsupported = ["rust", "rs", "python", "py", "wgsl", "nix", "lean", "text", "txt"]

[capabilities]
quotable = {status = "supported"}
hole-positions = {status = "supported"}
variadic-containers = {status = "supported"}
kind-classification = {status = "supported"}
lift-into = {status = "planned", note = "no `LiftTo<TypeScript>` marker in `lift.rs`, so a Rust host cannot lift a value into a TypeScript quote; the TypeScript host lifts its own values through the wasm runtime's `qlift`", issue = 149}
highlights = {status = "unsupported", note = "no `highlights.scm` is vendored for the TypeScript grammar"}
host = {status = "supported"}
lift-from = {status = "supported"}
reduce = {status = "supported", note = "`quilt run` binds the bare `quilt` import to the Node runtime (`quilt-wasm/node`), which re-expands a generated stage by shelling out to the `quilt` binary; needs `bin/build-ts`"}
emit = {status = "partial", note = "same fluent-chain shape as Python: no named accumulator, so emit from a ground loop is unavailable", issue = 152}
pattern-match = {status = "unsupported", note = "no `pattern_tag`/`pattern_var` implementation; pattern lets are a Rust-host feature"}
runnable = {status = "supported"}
runtime-binding = {status = "supported"}
glyph-collisions = {status = "supported"}
chain-member = {status = "supported"}
header-comment = {status = "supported"}
lsp = {status = "unsupported", note = "no `LanguageAdapter`; `.ts.quilt` files get no projection"}

[[fragments]]
name = "binary_expr"
kind = "expr"
code = "1 + 2"
tag = "binary_expression"

[[fragments]]
name = "lexical_declaration"
kind = "stmt"
code = "let x = 1 + 2;"
tag = "lexical_declaration"

[[fragments]]
name = "function_declaration"
code = "function f() { }"
tag = "function_declaration"

[[holes]]
name = "declaration_value"
code = "let x = @;"
ikinds = ["expr"]

[kinds]
program = "file"
lexical_declaration = "stmt"
function_declaration = "stmt"
binary_expression = "expr"

[meta]
emit = "emit(b_)"
type_str = "QTerm"
name_str = "name"
reduce_unsupported = ["rust", "rs", "python", "py", "wgsl", "html", "nix", "lean", "lean4", "bash", "zsh"]

[meta.reduce]
"" = "reduce()"
typescript = "reduce()"
ts = "reduce()"

# How this host embeds a quote of another language, for the cross-language grid
# (#158). `@` is replaced by `<target>↖…↗`; `lift` is how a lifted ground value
# is spelled in *this* host's syntax — Rust's `↑` is postfix, Python's prefix.
[cross]
wrapper = "let x = @;"
lift = "↑(v)"
