name = "typescript"
display = "TypeScript"
aliases = ["ts"]
feature = "typescript"
meta_kind = "runtime"
comment_prefix = "//"
lang_src = "quilt/src/langs/typescript/lang.rs"
meta_src = "quilt/src/langs/typescript/meta.rs"
blurb = """
The host behind the browser playground. Expanded `.ts.quilt` code calls the \
`quilt-wasm` runtime, so a metaprogram can run in the browser with no server — \
or under node, where `quilt run` binds the same runtime and adds `↓`."""

# Derived from the grammar's `REPEAT` rules (#202). `lexical_declaration` was
# pinned as *not* variadic while the table was hand-written; it is
# `commaSep1($.variable_declarator)`, so `const a = 1, b = 2` genuinely has a
# variable number of direct children.
#
# `arguments`, `array` and `formal_parameters` are containers the derivation
# added: emit (`←`) can now splice a sequence into an argument list.
variadic = [
  "program",
  "statement_block",
  "lexical_declaration",
  "arguments",
  "array",
  "formal_parameters",
]
not_variadic = ["binary_expression", "identifier"]

lift_marker = "TypeScript"

lift_from = ["typescript", "ts", "html", "text", "txt"]
lift_from_unsupported = ["rust", "rs", "python", "py", "wgsl", "nix", "lean", "lean4", "sql", "mysql", "mariadb"]

[capabilities]
quotable = {status = "supported"}
hole-positions = {status = "supported"}
variadic-containers = {status = "supported"}
kind-classification = {status = "supported"}
lift-into = {status = "supported", note = "numbers, booleans, strings and slices/`Vec`s all lift. One `number` node serves integers and floats, and a negative is a `unary_expression` over its magnitude, as the parser builds it. The Rust host's `LiftTo<TypeScript>` and the Python host's `qlift_ts` share the core's generated shapes; the TypeScript host's own `qlift` spells the same text"}
highlights = {status = "unsupported", note = "no `highlights.scm` is vendored for the TypeScript grammar"}
host = {status = "supported"}
lift-from = {status = "supported"}
reduce = {status = "supported", note = "`quilt run` binds the bare `quilt` import to the Node runtime (`quilt-wasm/node`), which re-expands a generated stage by shelling out to the `quilt` binary; needs `bin/build-ts`"}
machine = {status = "supported", note = "a persistent `ReplMachine`: one long-lived `node` running a small `vm`-context kernel, so a top-level `const` is real process state for later feeds and effects run once; a thrown exception rejects the feed. Queries answer through `JSON.stringify`, so values JSON cannot spell (functions, `undefined`) answer nothing. The replay `ScriptMachine` remains registered as `machine_spec`"}
emit = {status = "partial", note = "the *functional* reading of emit, as in Nix: `←(items)` (or `←(items, sep)`) spells the runtime's `qseq`, which splices a whole iterable of fragments into the surrounding container, a newline (respecting the prefix) between each unless `sep` is given. Rust's imperative reading — append to a `b_` accumulator once around a ground loop — is not offered: the fluent `.e(child)` chain has no named accumulator", issue = 152}
pattern-match = {status = "unsupported", note = "no `pattern_tag`/`pattern_var` implementation; pattern lets are a Rust-host feature"}
runnable = {status = "supported"}
runtime-binding = {status = "supported"}
glyph-collisions = {status = "supported"}
chain-member = {status = "supported"}
header-comment = {status = "supported"}
lsp = {status = "unsupported", note = "no `LanguageAdapter`; `.ts.quilt` files get no projection"}

[[fragments]]
name = "binary_expr"
kind = "expr"
code = "1 + 2"
tag = "binary_expression"

[[fragments]]
name = "lexical_declaration"
kind = "stmt"
code = "let x = 1 + 2;"
tag = "lexical_declaration"

[[fragments]]
name = "function_declaration"
code = "function f() { }"
tag = "function_declaration"

[[holes]]
name = "declaration_value"
code = "let x = @;"
ikinds = ["expr"]

[[lift]]
value = "u32:3"
tag = "number"
text = "3"

# Unsigned in the grammar: the sign is a `unary_expression` over the magnitude.
[[lift]]
value = "i32:-7"
tag = "unary_expression"
text = "-7"

[[lift]]
value = "f32:1.5"
tag = "number"
text = "1.5"

[[lift]]
value = "f32:-1.5"
tag = "unary_expression"
text = "-1.5"

[[lift]]
value = "bool:true"
tag = "true"
text = "true"

[[lift]]
value = "bool:false"
tag = "false"
text = "false"

[[lift]]
value = "str:plain"
tag = "string"
text = '"hi"'

# `${` means nothing inside a double-quoted (as opposed to template) literal.
[[lift]]
value = "str:tricky"
tag = "string"
text = '"a\"b\\c${d}"'

[kinds]
program = "file"
lexical_declaration = "stmt"
function_declaration = "stmt"
binary_expression = "expr"

[meta]
# `←` is functional: `←(items)` spells the runtime's `qseq`.
emit = "qseq"
type_str = "QTerm"
name_str = "name"
reduce_unsupported = ["rust", "rs", "python", "py", "wgsl", "html", "nix", "lean", "lean4", "bash", "zsh"]

[meta.reduce]
"" = "reduce()"
typescript = "reduce()"
ts = "reduce()"

# How this host embeds a quote of another language, for the cross-language grid
# (#158). `@` is replaced by `<target>↖…↗`; `lift` is how a lifted ground value
# is spelled in *this* host's syntax — Rust's `↑` is postfix, Python's prefix.
[cross]
wrapper = "let x = @;"
lift = "↑(v)"

# The `machine` axis probe (docs/design/machines.md): drives the persistent
# ReplMachine from `repl_spec` — one long-lived node running a `vm`-context
# kernel, answering via JSON.stringify. (The replay ScriptMachine from
# `machine_spec` is still registered.)
[machine]
define = "const y = 40"
query = "y + 2"
answer = "42"
