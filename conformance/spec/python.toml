name = "python"
display = "Python"
aliases = ["py"]
feature = "python"
meta_kind = "runtime"
comment_prefix = "#"
lang_src = "quilt/src/langs/python/lang.rs"
meta_src = "quilt/src/langs/python/meta.rs"
blurb = """
The second host. The PyO3 module in `quilt-python/` gives Python the same `QTerm` \
builder API the Rust runtime has, and `PythonMetaLanguage` expands quotes into \
calls against it."""

# Derived from the grammar's `REPEAT` rules (#202). `block` and `module` were
# the whole hand-written table; `argument_list`, `list` and `parameters` are
# containers the derivation added.
#
# `function_definition` stays a leaf, and the grammar agrees: the repeat it
# reaches is inside `alias($._simple_statements, $.block)`, so those statements
# are children of the `block`, not of the definition.
variadic = ["block", "module", "argument_list", "list", "parameters"]
not_variadic = ["binary_operator", "assignment", "function_definition"]

lift_marker = "Python"
lift_from = ["python", "py", "html"]
lift_from_unsupported = ["rust", "rs", "wgsl", "nix", "lean", "lean4", "typescript", "ts", "text", "txt"]

[capabilities]
quotable = {status = "supported"}
hole-positions = {status = "supported"}
variadic-containers = {status = "supported"}
kind-classification = {status = "supported"}
lift-into = {status = "supported"}
highlights = {status = "supported"}
host = {status = "supported"}
lift-from = {status = "supported"}
reduce = {status = "supported"}
emit = {status = "unsupported", note = "no statement-splice: Rust's variadic block is a *block expression* and can bind `let mut b_ = tb(..)`, but Python has no statement-block in expression position, so the block is built as a fluent `tb(..).e(child).b()` chain with no named accumulator — and the runtime exposes no `emit` method on a term either. A ground `←` is therefore a hard error naming the alternative: build the sequence with your own `tb(..)` builder in ground code and splice the finished term with `↙…↘`. Automatic emission of children into a variadic container is a separate mechanism (`wrap_child`) and is unaffected", issue = 152}
pattern-match = {status = "unsupported", note = "`PythonMetaLanguage` sets no `pattern_tag`, so a Python host cannot write `let ↖…↗ = …`. Python *fragments* can still be destructured by a Rust host, which is what `expand_rust.rs::pattern_let_runtime` exercises"}
runnable = {status = "supported"}
runtime-binding = {status = "supported"}
glyph-collisions = {status = "supported"}
chain-member = {status = "supported"}
header-comment = {status = "supported"}
lsp = {status = "supported"}

[[fragments]]
name = "binary_expr"
kind = "expr"
code = "1 + 2"
tag = "binary_operator"

[[fragments]]
name = "assignment"
kind = "stmt"
code = "x = 1 + 2"
tag = "assignment"

[[fragments]]
name = "call"
kind = "expr"
code = 'print("hi")'
tag = "call"

[[fragments]]
name = "function_def"
code = "def f(): return"
tag = "function_definition"

[[fragments]]
name = "module"
kind = "file"
code = "def f(): pass\ndef g(): pass"
tag = "module"

[[fragments]]
name = "indented_body"
code = "def foo():\n    pass"
tag = "function_definition"

[[fragments]]
name = "two_indented_defs"
kind = "file"
code = "def foo():\n    pass\ndef bar():\n    pass"
tag = "module"

[[holes]]
name = "assignment_value"
code = "x = @"
ikinds = ["expr"]

[[lift]]
value = "u32:3"
tag = "integer"
text = "3"

[[lift]]
value = "i32:-7"
tag = "integer"
text = "-7"

[[lift]]
value = "f32:1.5"
tag = "float"
text = "1.5"

[[lift]]
value = "f32:-1.5"
tag = "float"
text = "-1.5"

[[lift]]
value = "bool:true"
tag = "true"
text = "True"

[[lift]]
value = "bool:false"
tag = "false"
text = "False"

[[lift]]
value = "str:plain"
tag = "string"
text = '"hi"'

[[lift]]
value = "str:tricky"
tag = "string"
text = '"a\"b\\c${d}"'

[kinds]
module = "file"
assignment = "stmt"
function_definition = "stmt"
binary_operator = "expr"
call = "expr"

[meta]
# No `←`: the fluent `.e(child)` chain binds no `b_` for emit to append to.
emit_error = "your own `tb(..)` builder"
type_str = "QTerm"
name_str = "name"
reduce_unsupported = ["wgsl", "html", "nix", "lean", "lean4", "bash", "zsh", "typescript", "ts"]

[meta.reduce]
"" = "reduce()"
python = "reduce()"
py = "reduce()"
rust = "reduce_rs()"
rs = "reduce_rs()"

# How this host embeds a quote of another language, for the cross-language grid
# (#158). `@` is replaced by `<target>↖…↗`; `lift` is how a lifted ground value
# is spelled in *this* host's syntax — Rust's `↑` is postfix, Python's prefix.
[cross]
wrapper = "x = @"
lift = "↑(v)"
