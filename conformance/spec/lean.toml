name = "lean"
display = "Lean 4"
aliases = ["lean4"]
feature = "lean"
meta_kind = "string"
comment_prefix = "--"
lang_src = "quilt/src/langs/lean/lang.rs"
meta_src = "quilt/src/langs/lean/meta.rs"
blurb = """
A quotable target and a string-based host. Generate definitions, theorems and \
tactic proofs at build time; as a host, a `.lean.quilt` metaprogram expands to \
plain Lean that builds the output with `s!"…"` interpolation."""

# Derived from the grammar's `REPEAT` rules (#202). `def` and `theorem` were
# pinned as *not* variadic while the table was hand-written; the grammar
# disagrees, and it is right — both take `optional($._binders)`, which is a
# `repeat1` of binder nodes, so `def f (a : A) (b : B) := …` really does have a
# variable number of direct children.
variadic = ["module", "by", "do_block", "def", "theorem"]
not_variadic = ["binary_op"]

lift_marker = "Lean"
lift_from = ["lean", "lean4"]
lift_from_unsupported = ["rust", "rs", "python", "py", "wgsl", "nix", "html", "typescript", "ts", "text", "txt"]

[capabilities]
quotable = {status = "supported"}
hole-positions = {status = "partial", note = "term, tactic, do-element, declaration-name and binder position all work with the unpatched grammar (`__QUILT_HOLE__` matches Lean's identifier regex); whole-command position is reached only by the `#check …` wrapper fallback in `parse_pre`", issue = 133}
variadic-containers = {status = "supported"}
kind-classification = {status = "supported"}
lift-into = {status = "supported"}
highlights = {status = "supported"}
host = {status = "supported"}
lift-from = {status = "supported"}
reduce = {status = "planned", note = "no reduce backend: the string-based meta has no `QTerm` runtime to evaluate against", issue = 132}
emit = {status = "planned", note = "`emit_str` fails unconditionally: the string-based meta has no `b_` accumulator for `←` to append to, and the error points at `List.map` + `String.intercalate` instead. Automatic emission of children into the variadic `by` / `do` containers is a separate mechanism (`wrap_child`) and is unaffected; a top-level sequence of commands additionally needs a variadic `module`", issue = 133}
pattern-match = {status = "unsupported", note = "no `pattern_tag`/`pattern_var` implementation; Lean fragments can still be destructured by a Rust host"}
runnable = {status = "unsupported", note = "Lean has no interpreter shebang — a file runs via `lean file.lean` or `lake env lean`, and `#!` is not Lean comment syntax"}
runtime-binding = {status = "planned", note = "string-based meta: no `QTerm` runtime library is shipped for Lean", issue = 132}
glyph-collisions = {status = "partial", note = "`←` is Lean's monadic bind and is eaten by the emit glyph; `↑` (coercion) and `↓` (lowering) are also real Lean notation. The ASCII alias `<-` is the current workaround, and `\\←` does not escape because `←` is missing from the grammar's escape class", issue = 141}
chain-member = {status = "supported"}
header-comment = {status = "supported", note = "generated Lean files use `--`, not `//!`"}
lsp = {status = "supported", note = "Lean is a host with a `MetaLanguageAdapter` since #135"}

[[fragments]]
name = "term"
code = "n + 1"
tag = "binary_op"

[[fragments]]
name = "def"
code = "def f (n : Nat) : Nat := n + 1"
tag = "def"

[[fragments]]
name = "theorem_by_tactic"
code = "theorem t (n : Nat) : n + 0 = n := by simp"
tag = "theorem"

[[holes]]
name = "term_position"
code = "def f := @"
ikinds = ["expr"]

[[holes]]
name = "tactic_position"
code = "theorem t : True := by\n  @"
ikinds = ["stmt"]

[[lift]]
value = "u32:3"
tag = "num_lit"
text = "3"

[[lift]]
value = "i32:-7"
tag = "unary_op"
text = "-7"

[[lift]]
value = "bool:true"
tag = "true_const"
text = "true"

[[lift]]
value = "bool:false"
tag = "false_const"
text = "false"

[[lift]]
value = "str:plain"
tag = "str_lit"
text = '"hi"'

[[lift]]
value = "str:tricky"
tag = "str_lit"
text = '"a\"b\\c${d}"'

[kinds]
def = "item"
theorem = "item"
binary_op = "expr"

# String-based meta, like Nix: `←` has no `b_` accumulator to emit into.
[meta]
emit_error = "String.intercalate"
type_str = "String"
name_str = "id"
reduce_unsupported = ["", "lean", "lean4", "rust", "rs", "python", "py", "wgsl", "html", "nix", "bash", "zsh", "typescript", "ts"]

# How this host embeds a quote of another language, for the cross-language grid
# (#158). `@` is replaced by `<target>↖…↗`; `lift` is how a lifted ground value
# is spelled in *this* host's syntax — Rust's `↑` is postfix, Python's prefix.
[cross]
wrapper = "def x := @"
lift = "↑ v"
