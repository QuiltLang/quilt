name = "zsh"
display = "Zsh"
aliases = []
feature = "zsh"
meta_kind = "string"
comment_prefix = "#"
lang_src = "quilt/src/langs/zsh/lang.rs"
meta_src = "quilt/src/langs/shell/meta.rs"
blurb = """
A quotable target and a string-based host, sharing bash's grammar lineage and \
escaping rules. A lifted Rust string becomes a properly escaped double-quoted \
word; as a host, a `.zsh.quilt` metaprogram expands to a plain script that \
prints the output, and shares bash's `ShellMetaLanguage` for the same reason \
the tag tables are shared."""

# The table these are checked against is derived from the grammar's `REPEAT`
# rules (#202). Zsh's grammar is a fork of bash's, so this list overlaps
# bash.toml's heavily — but it is no longer maintained to *match* it: each side
# now follows its own grammar, and `function_definition` is the one shared node
# kind where the two genuinely differ (zsh's rule takes `repeat1(name)`, so
# `function a b c { … }` defines three functions at once).
variadic = [
  "program",
  "compound_statement",
  "subshell",
  "do_group",
  "command",
  "pipeline",
  "if_statement",
  "elif_clause",
  "else_clause",
  "case_statement",
  "case_item",
  "for_statement",
  "c_style_for_statement",
  "while_statement",
  "function_definition",
  "redirected_statement",
  "file_redirect",
  "variable_assignments",
  "declaration_command",
  "string",
  "concatenation",
  "array",
  "expansion",
  "arithmetic_expansion",
  # Zsh-only: the bash grammar defines none of these.
  "compound_statement_no_always",
  "expansion_default_list",
  "select_statement",
  # Repeat containers the zsh grammar has always had and neither hand-written
  # table declared, gained by deriving (#202).
  "expansion_default",
  "expansion_substring",
  "expansion_modifier",
  "terse_for_statement",
  "expansion_array",
  "expansion_pattern",
  "expansion_with_modifier",
  "arithmetic_call",
  # Substitutions and heredocs, shared with bash — see the matching block there.
  "command_substitution",
  "process_substitution",
  "heredoc_redirect",
  "heredoc_body",
  "unset_command",
]
# Over-declaring variadicity silently changes emit behaviour, so pin leaves too.
not_variadic = [
  "word",
  "variable_name",
  "comment",
  "test_operator",
  "file_descriptor",
  # Declared variadic by the hand-written table until #202, and wrong — see the
  # matching block in bash.toml. `repeat_statement` is the zsh-specific one:
  # `repeat N { … }` takes a count and a single body, so despite the name it
  # repeats at *run* time, not in the tree.
  "list",
  "test_command",
  "variable_assignment",
  "raw_string",
  "ansi_c_string",
  "subscript",
  "ternary_expression",
  "repeat_statement",
  "dollar_variable",
  "variable_ref",
  "zsh_array_subscript_flags",
]

lift_marker = "Zsh"
# See bash.toml: a shell value is already text, so `↑` has no conversion to
# name and the whole row is refused, the homogeneous `""` case included.
lift_from = []
lift_from_unsupported = ["", "zsh", "bash", "rust", "rs", "python", "py", "wgsl", "nix", "lean", "lean4", "html", "typescript", "ts", "text", "txt", "sql"]

[capabilities]
quotable = {status = "supported"}
hole-positions = {status = "supported", note = "a hole need not be a whole word: since #221 `build_nodes` splits the token around it, so besides command-argument, assignment-RHS, `[ … ]` and statement positions it also reaches inside a `\"…\"` string, inside a comment, and glued to adjacent text (`↙u↘.service`). The grammar is untouched — the fork's `quilt_hole` rule is still parked, since `tree-sitter generate` panics on it"}
variadic-containers = {status = "supported", note = "derived from the grammar's `REPEAT` rules by `bin/gen-arity`; agrees with bash's table on every shared node kind except `function_definition`, whose zsh rule takes `repeat1(name)`"}
kind-classification = {status = "unsupported", note = "no `typ()` override, so every tag reports the default `File`"}
lift-into = {status = "partial", note = "strings and integers only — the shells are word-oriented, so there is no float or bool `LiftTo<Zsh>` impl", issue = 149}
highlights = {status = "supported"}
host = {status = "supported", note = "string-based, sharing bash's `ShellMetaLanguage`: a quote becomes a double-quoted word and a host unquote is spliced into it verbatim, since a shell expansion carries its own `$`"}
lift-from = {status = "unsupported", note = "`↑` has no spelling: a shell value is already text, so there is no conversion to name, and an operator that expands to nothing is an invisible no-op rather than an operator. Splice with `↙…↘`, which interpolates as written"}
reduce = {status = "unsupported", note = "no reduce backend: the string-based meta has no `QTerm` runtime to evaluate against"}
emit = {status = "unsupported", note = "the string model has no `b_` accumulator for `←` to append to, and unlike Nix's `builtins.concatStringsSep` the shell's join cannot stand in as a spelling: an operator is applied *prefix* to what follows, while `printf '%s\\n' \"${xs[@]}\"` takes its operand inside a substitution. Collect the fragments in an array and splice the join itself"}
pattern-match = {status = "unsupported", note = "no `pattern_tag`/`pattern_var` implementation; zsh fragments can still be destructured by a Rust host"}
runnable = {status = "supported", note = "`quilt run foo.zsh.quilt` expands to a script that prints the generated code and executes it under `#!/usr/bin/env zsh` — no per-runner setup, since a string host needs no runtime importable"}
runtime-binding = {status = "unsupported", note = "string-based meta: generated code is shell words, so there is no `QTerm` builder API to publish for this host"}
glyph-collisions = {status = "supported"}
chain-member = {status = "supported"}
header-comment = {status = "supported", note = "generated shell files use `#`, not `//!`"}
lsp = {status = "partial", note = "embedded-quote highlighting only, from the vendored `highlights.scm`; no downstream zsh server is proxied, and — now that zsh can be the ground language — no `MetaLanguageAdapter` either, so a `.zsh.quilt` file gets no host-side support", issue = 154}

[[fragments]]
name = "command"
code = "echo hi"
tag = "command"

[[fragments]]
name = "assignment"
code = "X=1"
tag = "variable_assignment"

[[fragments]]
name = "program"
code = "echo a\necho b"
tag = "program"

[[holes]]
name = "command_argument"
code = "echo @"
ikinds = ["file"]

[[holes]]
name = "inside_a_string"
code = 'echo "hi @ there"'
ikinds = ["file"]

[[holes]]
name = "glued_to_a_word"
code = "systemctl start @.service"
ikinds = ["file"]

[[holes]]
name = "inside_a_comment"
code = "# built by @"
ikinds = ["file"]

[[lift]]
value = "u32:3"
tag = "number"
text = "3"

[[lift]]
value = "str:plain"
tag = "string"
text = '"hi"'

[[lift]]
value = "str:tricky"
tag = "string"
text = '"a\"b\\c\${d}"'

[kinds]
program = "file"
command = "file"

# Identical to bash.toml's: the two dialects share one `ShellMetaLanguage`, and
# the point of pinning both is that a future divergence has to be declared.
[meta]
emit_error = "printf"
type_error = "untyped"
reduce_unsupported = ["", "zsh", "bash", "nix", "rust", "rs", "python", "py", "wgsl", "html", "lean", "lean4", "typescript", "ts"]

[cross]
wrapper = "echo @"
lift = "↑ v"
