name = "zsh"
display = "Zsh"
aliases = []
feature = "zsh"
meta_kind = "none"
lang_src = "quilt/src/langs/zsh/lang.rs"
blurb = """
A target-only shell language, sharing bash's grammar lineage and escaping rules. \
A lifted Rust string becomes a properly escaped double-quoted word."""

# See bash.toml: the two arity tables have diverged. zsh has
# `compound_statement_no_always` and a set of expansion/arithmetic tags bash
# lacks, and is missing `variable_assignment` (singular), `for_statement`,
# `while_statement` and `function_definition`, which bash has.
variadic = [
  "program",
  "compound_statement",
  "compound_statement_no_always",
  "command",
  "list",
  "pipeline",
  "variable_assignments",
  "if_statement",
  "arithmetic_expansion",
]
not_variadic = ["variable_assignment"]

lift_marker = "Zsh"

[capabilities]
quotable = {status = "supported"}
hole-positions = {status = "supported"}
variadic-containers = {status = "partial", note = "the arity table has drifted from bash's: zsh omits `variable_assignment`, `for_statement`, `while_statement` and `function_definition`, so an emit into a zsh `for` body behaves differently from the identical bash one", issue = 144}
kind-classification = {status = "unsupported", note = "no `typ()` override, so every tag reports the default `File`"}
lift-into = {status = "partial", note = "strings and integers only — the shells are word-oriented, so there is no float or bool `LiftTo<Zsh>` impl", issue = 144}
highlights = {status = "supported"}
host = {status = "unsupported", note = "target-only: no `MetaLanguage`, so the host's meta drives expansion"}
lift-from = {status = "unsupported", note = "target-only: nothing to lift from"}
reduce = {status = "unsupported", note = "target-only: no meta-language to reduce with"}
emit = {status = "unsupported", note = "target-only: `←` is the *host's* operator, so this language has no emit of its own. What matters for a target is having variadic containers to receive emitted children, which is the Variadic axis"}
pattern-match = {status = "unsupported", note = "target-only; zsh fragments can still be destructured by a Rust host"}
runnable = {status = "partial", note = "`hashbang()` returns `#!/usr/bin/env zsh`, but zsh has no `MetaLanguage` so it can never be a ground language — the shebang is unreachable through `quilt run`", issue = 144}
runtime-binding = {status = "unsupported", note = "target-only: no runtime library"}
glyph-collisions = {status = "supported"}
chain-member = {status = "supported"}
header-comment = {status = "unsupported", note = "target-only: never the ground language, so no generated-file header is produced"}
lsp = {status = "partial", note = "embedded-quote highlighting only, from the vendored `highlights.scm`; no downstream zsh server is proxied", issue = 144}

[[fragments]]
name = "command"
code = "echo hi"
tag = "command"

[[fragments]]
name = "assignment"
code = "X=1"
tag = "variable_assignment"

[[fragments]]
name = "program"
code = "echo a\necho b"
tag = "program"

[[holes]]
name = "command_argument"
code = "echo @"
ikinds = ["file"]

[[lift]]
value = "u32:3"
tag = "number"
text = "3"

[[lift]]
value = "str:plain"
tag = "string"
text = '"hi"'

[[lift]]
value = "str:tricky"
tag = "string"
text = '"a\"b\\c\${d}"'

[kinds]
program = "file"
command = "file"
