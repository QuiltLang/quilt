name = "bash"
display = "Bash"
aliases = []
feature = "bash"
meta_kind = "string"
comment_prefix = "#"
lang_src = "quilt/src/langs/bash/lang.rs"
meta_src = "quilt/src/langs/shell/meta.rs"
blurb = """
A quotable target and a string-based host. Generate scripts with correct \
quoting: a lifted Rust string becomes a double-quoted word with `\"`, `\\`, `$` \
and backticks escaped, so the value stays inert data. As a host, a \
`.bash.quilt` metaprogram expands to a plain script that prints the output, \
splicing values with the shell's own interpolation."""

# The table these are checked against is derived from the grammar's `REPEAT`
# rules (#202), so this list is a claim about the *grammar*: these node kinds
# take a variable number of direct children.
#
# It still overlaps zsh.toml's heavily, since zsh's grammar is a fork of bash's,
# but the two are no longer maintained to *match* — each follows its own grammar.
variadic = [
  "program",
  "compound_statement",
  "subshell",
  "do_group",
  "command",
  "pipeline",
  "if_statement",
  "elif_clause",
  "else_clause",
  "case_statement",
  "case_item",
  "for_statement",
  "c_style_for_statement",
  "while_statement",
  "redirected_statement",
  "file_redirect",
  "variable_assignments",
  "declaration_command",
  "string",
  "concatenation",
  "array",
  "expansion",
  "arithmetic_expansion",
  # Substitutions and heredocs. #150's shared table declared these and the
  # derivation agrees, so they stay claimed — the two lists are the same set
  # here, reached two different ways.
  "command_substitution",
  "process_substitution",
  "heredoc_redirect",
  "heredoc_body",
  "unset_command",
]
# Over-declaring variadicity silently changes emit behaviour, so pin leaves too.
not_variadic = [
  "word",
  "variable_name",
  "comment",
  "test_operator",
  "file_descriptor",
  # Declared variadic by the hand-written table until #202, and wrong: the bash
  # grammar gives none of these a repeated child. `list` (`a && b`) is a binary
  # sequence of two statements; `function_definition` takes exactly one body
  # (zsh's takes `repeat1` names, which is why *its* spec still claims it);
  # `raw_string`, `ansi_c_string` and `simple_expansion` have no children at
  # all. The rest reach a repeat only through a category rule or an alias, so
  # the repetition belongs to the `word` or `binary_expression` underneath
  # rather than to the node itself.
  "list",
  "function_definition",
  "test_command",
  "variable_assignment",
  "raw_string",
  "ansi_c_string",
  "subscript",
  "ternary_expression",
  "simple_expansion",
]

lift_marker = "Bash"
# A shell host cannot spell `↑` at all: every shell value is already text, so
# the conversion `lift_str` exists to name has nothing to do, and spelling it
# `""` would make the glyph an invisible no-op in the generated script. So the
# whole row is refused, the homogeneous `""` case included.
lift_from = []
lift_from_unsupported = ["", "bash", "zsh", "rust", "rs", "python", "py", "wgsl", "nix", "lean", "lean4", "html", "typescript", "ts", "text", "txt"]

[capabilities]
quotable = {status = "supported"}
hole-positions = {status = "supported", note = "a hole need not be a whole word: since #221 `build_nodes` splits the token around it, so besides command-argument, assignment-RHS, `[ … ]` and statement positions it also reaches inside a `\"…\"` string, inside a comment, and glued to adjacent text (`↙u↘.service`). The grammar is untouched — the fork's `quilt_hole` rule is still parked, since `tree-sitter generate` panics on it"}
variadic-containers = {status = "supported", note = "derived from the grammar's `REPEAT` rules by `bin/gen-arity`; agrees with zsh's table on every shared node kind except `function_definition`, where the two grammars themselves differ"}
kind-classification = {status = "unsupported", note = "no `typ()` override, so every tag reports the default `File`"}
lift-into = {status = "partial", note = "strings and integers only — the shells are word-oriented, so there is no float or bool `LiftTo<Bash>` impl", issue = 149}
highlights = {status = "supported"}
host = {status = "supported", note = "string-based, like Nix and Lean: a quote becomes a double-quoted word and a host unquote is spliced into it verbatim, since a shell expansion carries its own `$`"}
lift-from = {status = "unsupported", note = "`↑` has no spelling: a shell value is already text, so there is no conversion to name, and an operator that expands to nothing is an invisible no-op rather than an operator. Splice with `↙…↘`, which interpolates as written"}
reduce = {status = "unsupported", note = "no reduce backend: the string-based meta has no `QTerm` runtime to evaluate against"}
emit = {status = "unsupported", note = "the string model has no `b_` accumulator for `←` to append to, and unlike Nix's `builtins.concatStringsSep` the shell's join cannot stand in as a spelling: an operator is applied *prefix* to what follows, while `printf '%s\\n' \"${xs[@]}\"` takes its operand inside a substitution. Collect the fragments in an array and splice the join itself"}
pattern-match = {status = "unsupported", note = "no `pattern_tag`/`pattern_var` implementation; bash fragments can still be destructured by a Rust host"}
runnable = {status = "supported", note = "`quilt run foo.bash.quilt` expands to a script that prints the generated code and executes it under `#!/usr/bin/env bash` — no per-runner setup, since a string host needs no runtime importable"}
runtime-binding = {status = "unsupported", note = "string-based meta: generated code is shell words, so there is no `QTerm` builder API to publish for this host"}
glyph-collisions = {status = "supported"}
chain-member = {status = "supported"}
header-comment = {status = "supported", note = "generated shell files use `#`, not `//!`"}
lsp = {status = "partial", note = "embedded-quote highlighting only, from the vendored `highlights.scm`; no downstream bash server is proxied, and — now that bash can be the ground language — no `MetaLanguageAdapter` either, so a `.bash.quilt` file gets no host-side support", issue = 154}

[[fragments]]
name = "command"
code = "echo hi"
tag = "command"

[[fragments]]
name = "assignment"
code = "X=1"
tag = "variable_assignment"

[[fragments]]
name = "program"
code = "echo a\necho b"
tag = "program"

[[fragments]]
name = "if_statement"
code = "if true; then\n  echo hi\nfi"
tag = "if_statement"

[[holes]]
name = "command_argument"
code = "echo @"
ikinds = ["file"]

[[holes]]
name = "inside_a_string"
code = 'echo "hi @ there"'
ikinds = ["file"]

[[holes]]
name = "glued_to_a_word"
code = "systemctl start @.service"
ikinds = ["file"]

[[holes]]
name = "inside_a_comment"
code = "# built by @"
ikinds = ["file"]

[[lift]]
value = "u32:3"
tag = "number"
text = "3"

[[lift]]
value = "str:plain"
tag = "string"
text = '"hi"'

[[lift]]
value = "str:tricky"
tag = "string"
text = '"a\"b\\c\${d}"'

[kinds]
program = "file"
command = "file"

# String-based meta with no prefix-applied word operators to borrow, so four of
# the five glyphs refuse rather than leak a placeholder into a generated script.
# `name_str` is absent for the same reason as `↑`: a name in the string model is
# already its own text, and the shell has no identity function to say so with.
[meta]
emit_error = "printf"
type_error = "untyped"
reduce_unsupported = ["", "bash", "zsh", "nix", "rust", "rs", "python", "py", "wgsl", "html", "lean", "lean4", "typescript", "ts"]

# How this host embeds a quote of another language, for the cross-language grid
# (#158). `@` is replaced by `<target>↖…↗`; `lift` is how a lifted ground value
# would be spelled here — it must fail, per `lift_from_unsupported` above.
[cross]
wrapper = "echo @"
lift = "↑ v"
