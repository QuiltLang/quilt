name = "bash"
display = "Bash"
aliases = []
feature = "bash"
meta_kind = "none"
comment_prefix = "#"
lang_src = "quilt/src/langs/bash/lang.rs"
blurb = """
A target-only shell language. Generate scripts with correct quoting: a lifted \
Rust string becomes a double-quoted word with `\"`, `\\`, `$` and backticks \
escaped, so the value stays inert data."""

# Bash and zsh are documented as near-identical and share a grammar lineage, so
# both declare the same shell containers (#150). Everything from here to the
# dialect-only block is byte-identical with zsh.toml on purpose: a future
# divergence shows up as a diff between the two files rather than as a silent
# behaviour difference. `quilt::langs::shell` is the single table both providers
# answer from, and `grammar_tags::shell_dialects_agree_on_shared_kinds` fails if
# they ever stop agreeing.
variadic = [
  # Scripts and statement containers.
  "program",
  "compound_statement",
  "subshell",
  "list",
  "pipeline",
  "do_group",
  "if_statement",
  "elif_clause",
  "else_clause",
  "case_statement",
  "case_item",
  "for_statement",
  "c_style_for_statement",
  "while_statement",
  "function_definition",
  "redirected_statement",
  "negated_command",
  "command",
  "command_name",
  "declaration_command",
  "unset_command",
  "test_command",
  # Redirections.
  "file_redirect",
  "heredoc_redirect",
  "herestring_redirect",
  "heredoc_body",
  # Only the plural assignment node is a container; see `not_variadic`.
  "variable_assignments",
  # Words and expansions.
  "string",
  "raw_string",
  "ansi_c_string",
  "translated_string",
  "concatenation",
  "array",
  "subscript",
  "expansion",
  "command_substitution",
  "process_substitution",
  "arithmetic_expansion",
  # Arithmetic and test expressions.
  "brace_expression",
  "parenthesized_expression",
  "binary_expression",
  "unary_expression",
  "ternary_expression",
  "postfix_expression",
  "number",
  # --- bash-only kinds below this line ---
  # `$x`. zsh's grammar has no `simple_expansion`; it spells this
  # `variable_ref` / `dollar_variable`, which zsh.toml claims instead.
  "simple_expansion",
]
# `variable_assignment` (singular) is a fixed name/`=`/value triple, not a
# sequence — `variable_assignments` (plural) is the `X=1 Y=2` repeat. bash's
# table claimed both, which is the copy-paste divergence #150 names. `word` and
# `comment` are leaf negative controls.
not_variadic = ["variable_assignment", "word", "comment"]

lift_marker = "Bash"

[capabilities]
quotable = {status = "supported"}
hole-positions = {status = "supported"}
variadic-containers = {status = "supported", note = "shares one table with zsh (`quilt::langs::shell`), so the two dialects classify every node kind their grammars share identically"}
kind-classification = {status = "unsupported", note = "no `typ()` override, so every tag reports the default `File`"}
lift-into = {status = "partial", note = "strings and integers only — the shells are word-oriented, so there is no float or bool `LiftTo<Bash>` impl", issue = 149}
highlights = {status = "supported"}
host = {status = "unsupported", note = "target-only: no `MetaLanguage`, so the host's meta drives expansion"}
lift-from = {status = "unsupported", note = "target-only: nothing to lift from"}
reduce = {status = "unsupported", note = "target-only: no meta-language to reduce with"}
emit = {status = "unsupported", note = "target-only: `←` is the *host's* operator, so this language has no emit of its own. What matters for a target is having variadic containers to receive emitted children, which is the Variadic axis"}
pattern-match = {status = "unsupported", note = "target-only; bash fragments can still be destructured by a Rust host"}
runnable = {status = "partial", note = "`hashbang()` returns `#!/usr/bin/env bash`, but bash has no `MetaLanguage` so it can never be a ground language — the shebang is unreachable through `quilt run`", issue = 151}
runtime-binding = {status = "unsupported", note = "target-only: no runtime library"}
glyph-collisions = {status = "supported"}
chain-member = {status = "supported"}
header-comment = {status = "unsupported", note = "target-only: never the ground language, so no generated-file header is produced"}
lsp = {status = "partial", note = "embedded-quote highlighting only, from the vendored `highlights.scm`; no downstream bash server is proxied", issue = 154}

[[fragments]]
name = "command"
code = "echo hi"
tag = "command"

[[fragments]]
name = "assignment"
code = "X=1"
tag = "variable_assignment"

[[fragments]]
name = "program"
code = "echo a\necho b"
tag = "program"

[[fragments]]
name = "if_statement"
code = "if true; then\n  echo hi\nfi"
tag = "if_statement"

[[holes]]
name = "command_argument"
code = "echo @"
ikinds = ["file"]

[[lift]]
value = "u32:3"
tag = "number"
text = "3"

[[lift]]
value = "str:plain"
tag = "string"
text = '"hi"'

[[lift]]
value = "str:tricky"
tag = "string"
text = '"a\"b\\c\${d}"'

[kinds]
program = "file"
command = "file"
