name = "bash"
display = "Bash"
aliases = []
feature = "bash"
meta_kind = "none"
comment_prefix = "#"
lang_src = "quilt/src/langs/bash/lang.rs"
blurb = """
A target-only shell language. Generate scripts with correct quoting: a lifted \
Rust string becomes a double-quoted word with `\"`, `\\`, `$` and backticks \
escaped, so the value stays inert data."""

# The table these are checked against is derived from the grammar's `REPEAT`
# rules (#202), so this list is a claim about the *grammar*: these node kinds
# take a variable number of direct children.
#
# It still overlaps zsh.toml's heavily, since zsh's grammar is a fork of bash's,
# but the two are no longer maintained to *match* — each follows its own grammar.
variadic = [
  "program",
  "compound_statement",
  "subshell",
  "do_group",
  "command",
  "pipeline",
  "if_statement",
  "elif_clause",
  "else_clause",
  "case_statement",
  "case_item",
  "for_statement",
  "c_style_for_statement",
  "while_statement",
  "redirected_statement",
  "file_redirect",
  "variable_assignments",
  "declaration_command",
  "string",
  "concatenation",
  "array",
  "expansion",
  "arithmetic_expansion",
]
# Over-declaring variadicity silently changes emit behaviour, so pin leaves too.
not_variadic = [
  "word",
  "variable_name",
  "comment",
  "test_operator",
  "file_descriptor",
  # Declared variadic by the hand-written table until #202, and wrong: the bash
  # grammar gives none of these a repeated child. `list` (`a && b`) is a binary
  # sequence of two statements; `function_definition` takes exactly one body
  # (zsh's takes `repeat1` names, which is why *its* spec still claims it);
  # `raw_string`, `ansi_c_string` and `simple_expansion` have no children at
  # all. The rest reach a repeat only through a category rule or an alias, so
  # the repetition belongs to the `word` or `binary_expression` underneath
  # rather than to the node itself.
  "list",
  "function_definition",
  "test_command",
  "variable_assignment",
  "raw_string",
  "ansi_c_string",
  "subscript",
  "ternary_expression",
  "simple_expansion",
]

lift_marker = "Bash"

[capabilities]
quotable = {status = "supported"}
hole-positions = {status = "supported"}
variadic-containers = {status = "supported", note = "derived from the grammar's `REPEAT` rules by `bin/gen-arity`; agrees with zsh's table on every shared node kind except `function_definition`, where the two grammars themselves differ"}
kind-classification = {status = "unsupported", note = "no `typ()` override, so every tag reports the default `File`"}
lift-into = {status = "partial", note = "strings and integers only — the shells are word-oriented, so there is no float or bool `LiftTo<Bash>` impl", issue = 149}
highlights = {status = "supported"}
host = {status = "unsupported", note = "target-only: no `MetaLanguage`, so the host's meta drives expansion"}
lift-from = {status = "unsupported", note = "target-only: nothing to lift from"}
reduce = {status = "unsupported", note = "target-only: no meta-language to reduce with"}
emit = {status = "unsupported", note = "target-only: `←` is the *host's* operator, so this language has no emit of its own. What matters for a target is having variadic containers to receive emitted children, which is the Variadic axis"}
pattern-match = {status = "unsupported", note = "target-only; bash fragments can still be destructured by a Rust host"}
runnable = {status = "partial", note = "`hashbang()` returns `#!/usr/bin/env bash`, but bash has no `MetaLanguage` so it can never be a ground language — the shebang is unreachable through `quilt run`", issue = 151}
runtime-binding = {status = "unsupported", note = "target-only: no runtime library"}
glyph-collisions = {status = "supported"}
chain-member = {status = "supported"}
header-comment = {status = "unsupported", note = "target-only: never the ground language, so no generated-file header is produced"}
lsp = {status = "partial", note = "embedded-quote highlighting only, from the vendored `highlights.scm`; no downstream bash server is proxied", issue = 154}

[[fragments]]
name = "command"
code = "echo hi"
tag = "command"

[[fragments]]
name = "assignment"
code = "X=1"
tag = "variable_assignment"

[[fragments]]
name = "program"
code = "echo a\necho b"
tag = "program"

[[fragments]]
name = "if_statement"
code = "if true; then\n  echo hi\nfi"
tag = "if_statement"

[[holes]]
name = "command_argument"
code = "echo @"
ikinds = ["file"]

[[lift]]
value = "u32:3"
tag = "number"
text = "3"

[[lift]]
value = "str:plain"
tag = "string"
text = '"hi"'

[[lift]]
value = "str:tricky"
tag = "string"
text = '"a\"b\\c\${d}"'

[kinds]
program = "file"
command = "file"
