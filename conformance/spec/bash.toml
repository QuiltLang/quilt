name = "bash"
display = "Bash"
aliases = []
feature = "bash"
meta_kind = "none"
comment_prefix = "#"
lang_src = "quilt/src/langs/bash/lang.rs"
blurb = """
A target-only shell language. Generate scripts with correct quoting: a lifted \
Rust string becomes a double-quoted word with `\"`, `\\`, `$` and backticks \
escaped, so the value stays inert data."""

# Bash and zsh are documented as near-identical and zsh's grammar is a fork of
# bash's, so the block below is deliberately identical to zsh.toml's, in the same
# order; only the entries one grammar has no node kind for follow it. A future
# divergence therefore shows up as a diff between these two files as well.
# The eleven tags marked below are the ones whose classification had drifted
# between the two (#150); pinning them on both sides keeps the reconciliation
# from quietly coming undone.
variadic = [
  "program",
  "compound_statement",
  "subshell",
  "list",
  "pipeline",
  "command",
  "do_group",
  "if_statement",
  "elif_clause",
  "else_clause",
  "case_statement",
  "case_item",
  # The eleven that had drifted. Both grammars define all of them.
  "for_statement",
  "c_style_for_statement",
  "while_statement",
  "function_definition",
  "test_command",
  "variable_assignment",
  "file_redirect",
  "raw_string",
  "ansi_c_string",
  "subscript",
  "ternary_expression",
  # Shared containers that never drifted.
  "redirected_statement",
  "variable_assignments",
  "declaration_command",
  "string",
  "concatenation",
  "array",
  "expansion",
  "arithmetic_expansion",
  # Bash-only: zsh spells this `dollar_variable` / `variable_ref`.
  "simple_expansion",
]
# Over-declaring variadicity silently changes emit behaviour, so pin leaves too.
# All five are kinds both shell grammars define.
not_variadic = [
  "word",
  "variable_name",
  "comment",
  "test_operator",
  "file_descriptor",
]

lift_marker = "Bash"

[capabilities]
quotable = {status = "supported"}
hole-positions = {status = "supported"}
variadic-containers = {status = "supported", note = "agrees with zsh's table on every node kind both grammars define"}
kind-classification = {status = "unsupported", note = "no `typ()` override, so every tag reports the default `File`"}
lift-into = {status = "partial", note = "strings and integers only — the shells are word-oriented, so there is no float or bool `LiftTo<Bash>` impl", issue = 149}
highlights = {status = "supported"}
host = {status = "unsupported", note = "target-only: no `MetaLanguage`, so the host's meta drives expansion"}
lift-from = {status = "unsupported", note = "target-only: nothing to lift from"}
reduce = {status = "unsupported", note = "target-only: no meta-language to reduce with"}
emit = {status = "unsupported", note = "target-only: `←` is the *host's* operator, so this language has no emit of its own. What matters for a target is having variadic containers to receive emitted children, which is the Variadic axis"}
pattern-match = {status = "unsupported", note = "target-only; bash fragments can still be destructured by a Rust host"}
runnable = {status = "partial", note = "`hashbang()` returns `#!/usr/bin/env bash`, but bash has no `MetaLanguage` so it can never be a ground language — the shebang is unreachable through `quilt run`", issue = 151}
runtime-binding = {status = "unsupported", note = "target-only: no runtime library"}
glyph-collisions = {status = "supported"}
chain-member = {status = "supported"}
header-comment = {status = "unsupported", note = "target-only: never the ground language, so no generated-file header is produced"}
lsp = {status = "partial", note = "embedded-quote highlighting only, from the vendored `highlights.scm`; no downstream bash server is proxied", issue = 154}

[[fragments]]
name = "command"
code = "echo hi"
tag = "command"

[[fragments]]
name = "assignment"
code = "X=1"
tag = "variable_assignment"

[[fragments]]
name = "program"
code = "echo a\necho b"
tag = "program"

[[fragments]]
name = "if_statement"
code = "if true; then\n  echo hi\nfi"
tag = "if_statement"

[[holes]]
name = "command_argument"
code = "echo @"
ikinds = ["file"]

[[lift]]
value = "u32:3"
tag = "number"
text = "3"

[[lift]]
value = "str:plain"
tag = "string"
text = '"hi"'

[[lift]]
value = "str:tricky"
tag = "string"
text = '"a\"b\\c\${d}"'

[kinds]
program = "file"
command = "file"
