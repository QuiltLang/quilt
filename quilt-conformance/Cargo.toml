[package]
edition.workspace = true
name = "quilt-conformance"
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Dev-only harness (issue #144). It verifies every capability claim in
# `conformance/spec/*.toml` against the real implementations and regenerates
# `conformance/support-matrix.json` + `docs/wiki/support-matrix.md`, which the
# website renders. Nothing depends on it at runtime, so it is never published.
publish = false

[dependencies]
# Every language feature: the harness is a whole-registry check, so a language
# compiled out would silently drop its rows from the matrix. `bin/check-matrix`
# fails on the resulting drift, but enabling them here keeps the default
# `cargo test` honest.
quilt = {workspace = true, features = [
  "parse",
  "bash",
  "html",
  "lean",
  "nix",
  "python",
  "rust",
  "text",
  "typescript",
  "wgsl",
  "zsh",
]}
miette = {workspace = true, features = ["fancy"]}
# The corpus's `postcard_roundtrip` check (issue #192): the serde derives live
# in quilt, but the wire format they produce is what the heterogeneous reduce
# protocol and quilt-python's postcard_bytes / from_postcard_bytes pair agree on.
postcard = {workspace = true, features = ["alloc", "use-std"]}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
toml = {workspace = true}
# Read each vendored grammar's symbol table, so a hand-written tag table can be
# checked against the grammar it describes (tests/grammar_tags.rs).
tree-sitter = {workspace = true}

[dev-dependencies]
# Snapshot the tag tables derived from the vendored grammars, so a grammar bump
# that renames a node kind is a reviewable diff rather than a silent behaviour
# change (the #157 approach; see tests/grammar_tags.rs).
insta = {workspace = true}
pretty_assertions = {workspace = true}

[lints]
workspace = true

[[bin]]
name = "gen-matrix"
path = "src/bin/gen_matrix.rs"
