[package]
edition.workspace = true
name = "quilt-lsp"
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Language Server for Quilt (.quilt) files: a multiplexing host that proxies to per-language servers."

[dependencies]
tower-lsp.workspace = true
tokio = {workspace = true, features = ["full"]}
dashmap.workspace = true
anyhow.workspace = true
serde = {workspace = true, features = ["derive"]}
serde_json.workspace = true
tracing = {workspace = true}
tracing-subscriber = {workspace = true, features = ["env-filter"]}
tree-sitter = {workspace = true}
# The downstream-language parsers + highlight queries come from the published
# `quiltlang` crate's vendored `quilt::grammars` module (issue #32) — depending
# on the tree-sitter-* forks directly would pull git deps crates.io rejects and
# block publishing. Optional: only enabled by the per-language features below.
quilt = {workspace = true, optional = true}
streaming-iterator = {workspace = true}

[dev-dependencies]
tempfile.workspace = true
# `comment_syntax_comes_from_quilt` reads the language registry directly, so the
# tests need `quilt` even in a build whose features pull in no adapter at all.
quilt = {workspace = true, features = ["parse"]}

[features]
# Mirror quilt's own feature flags: each enables wiring for one downstream
# language. v1 ships only `rust`. Others are reserved extension points.
default = ["rust", "python", "wgsl", "html", "bash", "zsh", "nix", "lean", "sql"]
# Each language enables the matching *quilt* language, because an adapter needs
# two things from quilt: its grammar and highlight query (`quilt::grammars`,
# under the `parse` umbrella) and its entry in the language registry, which is
# where the adapter's line comment now comes from (issue #194). The registry
# entry is gated on quilt's own per-language feature, so `quilt/parse` alone is
# not enough — with only that, `quilt::langs::line_comment("rust")` is `None`.
#
# rust and python are the two that have to name both: quilt's `rust` and
# `python` features are runtime-only and deliberately do not imply `parse`
# (quilt-wasm and nanobots-codegen build them for wasm32 without tree-sitter —
# issue #162). The rest each imply it already.
rust = ["quilt/rust", "quilt/parse"]
python = ["quilt/python", "quilt/parse"]
wgsl = ["quilt/wgsl"]
html = ["quilt/html"]
bash = ["quilt/bash"]
zsh = ["quilt/zsh"]
nix = ["quilt/nix"]
lean = ["quilt/lean"]
sql = ["quilt/sql"]

[lints]
workspace = true

[lib]
name = "quilt_lsp"
path = "src/lib.rs"

[[bin]]
name = "quilt-lsp"
path = "src/main.rs"
